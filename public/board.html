.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

.form-check:not(.form-switch)

  height: 100%;

  height: 14px;

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

}

.form-check-label {

}

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-switch .form-check-input:focus-visible {

.form-range {

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

          &lt;/article&gt;
          &lt;article class=&quot;sdd-analysis-panel&quot;&gt;
            &lt;header class=&quot;sdd-analysis-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;sdd-eyebrow&quot;&gt;耗时对比&lt;/span&gt;&lt;h3&gt;平均耗时 / 次执行&lt;/h3&gt;&lt;p&gt;六个阶段各自使用独立的时间比例。&lt;/p&gt;&lt;/div&gt;&lt;strong data-time-total-label&gt;总计 41分13秒&lt;/strong&gt;&lt;/header&gt;

          &lt;article class=&quot;sdd-output-card&quot;&gt;&lt;span&gt;规格文档&lt;/span&gt;&lt;strong data-output-spec&gt;1,286 行&lt;/strong&gt;&lt;/article&gt;
          &lt;article class=&quot;sdd-output-card&quot;&gt;&lt;span&gt;详设文档&lt;/span&gt;&lt;strong data-output-design&gt;2,041 行&lt;/strong&gt;&lt;/article&gt;

          &lt;div class=&quot;sdd-stat-grid sdd-stat-grid-head&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;阶段&lt;/span&gt;&lt;span&gt;N&lt;/span&gt;&lt;span&gt;平均 Token&lt;/span&gt;&lt;span&gt;平均耗时&lt;/span&gt;&lt;span&gt;平均产物&lt;/span&gt;&lt;span&gt;成功率&lt;/span&gt;&lt;/div&gt;

        &lt;footer class=&quot;sdd-detail-footer&quot;&gt;&lt;span&gt;阶段顺序：规格生成 → 详设生成 → Plan → 代码 → 编译 → DT&lt;/span&gt;&lt;span&gt;全部数据为代码仓级演示汇总，不代表实时监控&lt;/span&gt;&lt;/footer&gt;
      &lt;/section&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;sdd-dashboard&#x27;);
      if (!root) return;

      const stageLabels = {
        spec: &#x27;规格生成&#x27;,
        design: &#x27;详设生成&#x27;,
        plan: &#x27;Plan&#x27;,
        code: &#x27;代码&#x27;,
        compile: &#x27;编译&#x27;,
        dt: &#x27;DT&#x27;
      };
      const stageDescriptions = {
        spec: &#x27;需求形成可验收规格&#x27;,
        design: &#x27;规格展开为详设&#x27;,
        plan: &#x27;拆成可执行计划&#x27;,
        code: &#x27;按 Plan 修改代码&#x27;,
        compile: &#x27;构建与产物加载&#x27;,
        dt: &#x27;行为与失败边界确认&#x27;
      };
      const stageOrder = [&#x27;spec&#x27;, &#x27;design&#x27;, &#x27;plan&#x27;, &#x27;code&#x27;, &#x27;compile&#x27;, &#x27;dt&#x27;];
      const colors = [&#x27;#4f8fa5&#x27;, &#x27;#74b2b1&#x27;, &#x27;#a7c9bf&#x27;, &#x27;#d2a850&#x27;, &#x27;#c77955&#x27;, &#x27;#af6460&#x27;];

      const repositories = [
        {
          id: &#x27;router-core&#x27;, component: &#x27;路由&#x27;, branch: &#x27;master&#x27;, tasks: 32, updated: &#x27;08-26&#x27;, icon: &#x27;◇&#x27;,
          stages: {
            spec: { tokens: 32000, durationSec: 38, output: { value: 1180, unit: &#x27;行&#x27; }, samples: 32, success: 100 },
            design: { tokens: 44000, durationSec: 60, output: { value: 1740, unit: &#x27;行&#x27; }, samples: 32, success: 100 },
            plan: { tokens: 24000, durationSec: 31, output: { value: 6.2, unit: &#x27;个 Plan&#x27; }, samples: 32, success: 100 },
            code: { tokens: 382000, durationSec: 2360, output: { value: 642, unit: &#x27;LOC&#x27; }, samples: 32, success: 96.9 },
            compile: { tokens: null, durationSec: 82, output: null, samples: 32, success: 93.8 },
            dt: { tokens: null, durationSec: 164, output: { value: 98, unit: &#x27;个 Case&#x27; }, samples: 31, success: 91.4 }
          }
        },
        {
          id: &#x27;cli-framework&#x27;, component: &#x27;CLI&#x27;, branch: &#x27;main&#x27;, tasks: 18, updated: &#x27;08-26&#x27;, icon: &#x27;◇&#x27;,
          stages: {
            spec: { tokens: 24000, durationSec: 33, output: { value: 920, unit: &#x27;行&#x27; }, samples: 18, success: 100 },
            design: { tokens: 34000, durationSec: 53, output: { value: 1420, unit: &#x27;行&#x27; }, samples: 18, success: 100 },
            plan: { tokens: 18000, durationSec: 28, output: { value: 5.1, unit: &#x27;个 Plan&#x27; }, samples: 18, success: 100 },
            code: { tokens: 240000, durationSec: 1500, output: { value: 508, unit: &#x27;LOC&#x27; }, samples: 18, success: 100 },
            compile: { tokens: null, durationSec: 68, output: null, samples: 18, success: 94.4 },
            dt: { tokens: null, durationSec: 120, output: { value: 74, unit: &#x27;个 Case&#x27; }, samples: 17, success: 94.1 }
          }
        },
        {
          id: &#x27;agent-gateway&#x27;, component: &#x27;网关&#x27;, branch: &#x27;master&#x27;, tasks: 41, updated: &#x27;08-25&#x27;, icon: &#x27;◇&#x27;,
          stages: {
            spec: { tokens: 44000, durationSec: 49, output: { value: 1480, unit: &#x27;行&#x27; }, samples: 41, success: 100 },
            design: { tokens: 61000, durationSec: 77, output: { value: 2390, unit: &#x27;行&#x27; }, samples: 41, success: 97.6 },
            plan: { tokens: 30000, durationSec: 41, output: { value: 8.6, unit: &#x27;个 Plan&#x27; }, samples: 41, success: 97.6 },
            code: { tokens: 486000, durationSec: 2780, output: { value: 1042, unit: &#x27;LOC&#x27; }, samples: 41, success: 95.1 },
            compile: { tokens: null, durationSec: 104, output: null, samples: 41, success: 92.7 },
            dt: { tokens: null, durationSec: 216, output: { value: 148, unit: &#x27;个 Case&#x27; }, samples: 39, success: 89.7 }
          }
        },
        {
          id: &#x27;agent-harness&#x27;, component: &#x27;Harness&#x27;, branch: &#x27;main&#x27;, tasks: 27, updated: &#x27;08-25&#x27;, icon: &#x27;◇&#x27;,
          stages: {
            spec: { tokens: 38000, durationSec: 42, output: { value: 1286, unit: &#x27;行&#x27; }, samples: 27, success: 100 },
            design: { tokens: 52000, durationSec: 71, output: { value: 2041, unit: &#x27;行&#x27; }, samples: 27, success: 100 },
            plan: { tokens: 29000, durationSec: 36, output: { value: 7.4, unit: &#x27;个 Plan&#x27; }, samples: 27, success: 100 },
            code: { tokens: 419000, durationSec: 2040, output: { value: 812, unit: &#x27;LOC&#x27; }, samples: 27, success: 96.3 },
            compile: { tokens: null, durationSec: 96, output: null, samples: 27, success: 92.6 },
            dt: { tokens: null, durationSec: 188, output: { value: 126, unit: &#x27;个 Case&#x27; }, samples: 26, success: 92.3 }
          }
        }
      ];

      const state = { repoId: null };
      const views = { overview: root.querySelector(&#x27;[data-view=&quot;overview&quot;]&#x27;), detail: root.querySelector(&#x27;[data-view=&quot;detail&quot;]&#x27;) };

      const esc = (value) =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (char) =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[char]));
      const fmtTokens = (value) =&gt; {
        if (value === null || value === undefined) return &#x27;—&#x27;;
        if (value &gt;= 1000000) return `${(value / 1000000).toFixed(value % 1000000 === 0 ? 0 : 1)}M`;
        if (value &gt;= 1000) return `${Math.round(value / 1000)}K`;
        return String(value);
      };
      const fmtDuration = (seconds) =&gt; {
        if (seconds === null || seconds === undefined) return &#x27;—&#x27;;
        const minutes = Math.floor(seconds / 60);
        const remain = seconds % 60;
        if (minutes &gt;= 60) return `${Math.floor(minutes / 60)}小时${minutes % 60 ? `${minutes % 60}分` : &#x27;&#x27;}`;
        if (minutes === 0) return `${remain}秒`;
        return `${minutes}分${remain ? `${remain}秒` : &#x27;&#x27;}`;
      };
      const fmtNumber = (value) =&gt; Number.isInteger(value) ? value.toLocaleString(&#x27;en-US&#x27;) : value.toFixed(1);
      const stageTotal = (repo, field) =&gt; stageOrder.reduce((sum, id) =&gt; sum + (repo.stages[id][field] || 0), 0);
      const tokenTotal = (repo) =&gt; stageOrder.reduce((sum, id) =&gt; sum + (repo.stages[id].tokens || 0), 0);
      const durationTotal = (repo) =&gt; stageTotal(repo, &#x27;durationSec&#x27;);
      const docsTotal = (repo) =&gt; repo.stages.spec.output.value + repo.stages.design.output.value;
      const outputText = (output) =&gt; output ? `${fmtNumber(output.value)} ${output.unit}` : &#x27;—&#x27;;

      function setView(name) {
        Object.entries(views).forEach(([key, view]) =&gt; { view.hidden = key !== name; });
      }

      function renderOverviewSummary() {
        const taskTotal = repositories.reduce((sum, repo) =&gt; sum + repo.tasks, 0);
        const weightedTokens = repositories.reduce((sum, repo) =&gt; sum + tokenTotal(repo) * repo.tasks, 0) / taskTotal;
        const weightedDuration = repositories.reduce((sum, repo) =&gt; sum + durationTotal(repo) * repo.tasks, 0) / taskTotal;
        root.querySelector(&#x27;[data-overview-repos]&#x27;).textContent = String(repositories.length);
        root.querySelector(&#x27;[data-overview-tasks]&#x27;).textContent = String(taskTotal);
        root.querySelector(&#x27;[data-overview-token]&#x27;).textContent = fmtTokens(Math.round(weightedTokens));
        root.querySelector(&#x27;[data-overview-time]&#x27;).textContent = fmtDuration(Math.round(weightedDuration));
      }

      function renderOverview() {
        renderOverviewSummary();
        const rows = root.querySelector(&#x27;[data-repo-rows]&#x27;);
        rows.innerHTML = repositories.map((repo) =&gt; `
          &lt;button class=&quot;sdd-repo-row&quot; type=&quot;button&quot; data-open-repo=&quot;${esc(repo.id)}&quot;&gt;
            &lt;span class=&quot;sdd-repo-component&quot;&gt;${esc(repo.component)}&lt;/span&gt;
            &lt;span class=&quot;sdd-repo-name&quot;&gt;&lt;span class=&quot;sdd-repo-icon&quot; aria-hidden=&quot;true&quot;&gt;&lt;img src=&quot;/favicon.svg&quot; alt=&quot;&quot;&gt;&lt;/span&gt;&lt;span class=&quot;sdd-repo-name-copy&quot;&gt;&lt;strong&gt;${esc(repo.id)}&lt;/strong&gt;&lt;small&gt;代码仓整体平均&lt;/small&gt;&lt;/span&gt;&lt;/span&gt;
            &lt;span&gt;&lt;code class=&quot;sdd-branch&quot;&gt;${esc(repo.branch)}&lt;/code&gt;&lt;/span&gt;
            &lt;span class=&quot;sdd-repo-cell&quot;&gt;&lt;strong&gt;${repo.tasks}&lt;/strong&gt;&lt;small&gt;有效任务&lt;/small&gt;&lt;/span&gt;
            &lt;span class=&quot;sdd-repo-cell&quot;&gt;&lt;strong&gt;${fmtTokens(tokenTotal(repo))}&lt;/strong&gt;&lt;small&gt;每次执行&lt;/small&gt;&lt;/span&gt;
            &lt;span class=&quot;sdd-repo-cell&quot;&gt;&lt;strong&gt;${fmtDuration(durationTotal(repo))}&lt;/strong&gt;&lt;small&gt;每次执行&lt;/small&gt;&lt;/span&gt;
            &lt;span class=&quot;sdd-repo-cell&quot;&gt;&lt;strong&gt;${esc(repo.updated)}&lt;/strong&gt;&lt;small&gt;最近更新&lt;/small&gt;&lt;/span&gt;
            &lt;span class=&quot;sdd-row-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
          &lt;/button&gt;`).join(&#x27;&#x27;);
      }

      function stageStatus(stage) {
        if (stage.success &gt;= 98) return { label: &#x27;正常&#x27;, tone: &#x27;ok&#x27; };
        if (stage.success &gt;= 90) return { label: &#x27;关注&#x27;, tone: &#x27;warn&#x27; };
        return { label: &#x27;异常&#x27;, tone: &#x27;fail&#x27; };
      }

      function renderFlow(repo) {
        const flow = root.querySelector(&#x27;[data-flow-grid]&#x27;);
        flow.innerHTML = stageOrder.map((id, index) =&gt; {
          const stage = repo.stages[id];
          const status = stageStatus(stage);
          const metricLabel = stage.tokens === null ? &#x27;平均耗时&#x27; : &#x27;平均 Token&#x27;;
          const metricValue = stage.tokens === null ? fmtDuration(stage.durationSec) : fmtTokens(stage.tokens);
          const secondary = stage.tokens === null ? `${stage.success.toFixed(1)}% 成功` : `${fmtDuration(stage.durationSec)} · ${outputText(stage.output)}`;
          return `&lt;article class=&quot;sdd-stage-node&quot; data-tone=&quot;${status.tone}&quot;&gt;&lt;div class=&quot;sdd-stage-top&quot;&gt;&lt;span class=&quot;sdd-stage-index&quot;&gt;0${index + 1}&lt;/span&gt;&lt;span class=&quot;sdd-stage-secondary&quot;&gt;&lt;i class=&quot;sdd-status-dot&quot; data-tone=&quot;${status.tone}&quot;&gt;&lt;/i&gt;${status.label}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sdd-stage-title&quot;&gt;&lt;h3&gt;${stageLabels[id]}&lt;/h3&gt;&lt;p&gt;${stageDescriptions[id]}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sdd-stage-bottom&quot;&gt;&lt;div class=&quot;sdd-stage-metric&quot;&gt;&lt;span&gt;${metricLabel}&lt;/span&gt;&lt;strong&gt;${metricValue}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;sdd-stage-secondary&quot;&gt;&lt;strong&gt;${secondary}&lt;/strong&gt;&lt;span&gt;${stage.samples} 个样本&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;`;
        }).join(&#x27;&#x27;);
      }

      function renderBars(repo, selector, field, total, includeMissing) {
        const list = root.querySelector(selector);
        const values = stageOrder.filter((id) =&gt; includeMissing || repo.stages[id][field] !== null).map((id) =&gt; ({ id, value: repo.stages[id][field] || 0 }));
        const max = Math.max(...values.map((item) =&gt; item.value), 1);
        list.innerHTML = values.map(({ id, value }) =&gt; {
          const width = Math.max(4, Math.round((value / max) * 100));
          const display = field === &#x27;tokens&#x27; ? fmtTokens(value) : fmtDuration(value);
          return `&lt;li class=&quot;sdd-bar-row&quot;&gt;&lt;span class=&quot;sdd-bar-label&quot;&gt;${stageLabels[id]}&lt;/span&gt;&lt;span class=&quot;sdd-bar-track&quot; role=&quot;img&quot; aria-label=&quot;${stageLabels[id]} ${display}&quot;&gt;&lt;span class=&quot;sdd-bar-fill${id === &#x27;code&#x27; ? &#x27;&#x27; : &#x27;&#x27;}&quot; style=&quot;width:${width}%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;strong class=&quot;sdd-bar-value&quot;&gt;${display}&lt;/strong&gt;&lt;/li&gt;`;
        }).join(&#x27;&#x27;);
        if (!values.length) list.innerHTML = &#x27;&lt;li class=&quot;sdd-bar-empty&quot;&gt;暂无可比数据&lt;/li&gt;&#x27;;
        return total;
      }

      function renderBreakdown(repo, field, stackSelector, legendSelector, total) {
        const stack = root.querySelector(stackSelector);
        const legend = root.querySelector(legendSelector);
        const values = stageOrder.filter((id) =&gt; repo.stages[id][field] !== null).map((id) =&gt; ({ id, value: repo.stages[id][field] || 0 }));
        stack.innerHTML = values.map(({ id, value }) =&gt; `&lt;span style=&quot;width:${(value / total) * 100}%&quot; title=&quot;${stageLabels[id]} ${(value / total * 100).toFixed(1)}%&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;);
        legend.innerHTML = values.map(({ id, value }, index) =&gt; `&lt;span class=&quot;sdd-legend-item&quot;&gt;&lt;i style=&quot;background:${colors[index]}&quot;&gt;&lt;/i&gt;${stageLabels[id]} ${(value / total * 100).toFixed(1)}%&lt;/span&gt;`).join(&#x27;&#x27;);
      }

      function renderTrend(repo) {
        const factors = [0.82, 0.91, 0.88, 1.03, 0.96, 1.08, 0.93, 1.18, 0.99, 0.86, 1.05, 0.94];
        const chart = root.querySelector(&#x27;[data-trend-chart]&#x27;);
        const rows = factors.map((factor, index) =&gt; ({ label: `T${String(index + 9).padStart(2, &#x27;0&#x27;)}`, tokens: tokenTotal(repo) * factor, duration: durationTotal(repo) * (factor * (index % 3 === 0 ? 1.06 : 0.97)) }));
        const maxToken = Math.max(...rows.map((row) =&gt; row.tokens));
        const maxDuration = Math.max(...rows.map((row) =&gt; row.duration));
        chart.innerHTML = rows.map((row) =&gt; `&lt;div class=&quot;sdd-trend-column&quot;&gt;&lt;div class=&quot;sdd-trend-bars&quot;&gt;&lt;i title=&quot;${row.label} Token ${fmtTokens(Math.round(row.tokens))}&quot; style=&quot;height:${Math.max(5, row.tokens / maxToken * 100)}%&quot;&gt;&lt;/i&gt;&lt;i title=&quot;${row.label} 耗时 ${fmtDuration(Math.round(row.duration))}&quot; style=&quot;height:${Math.max(5, row.duration / maxDuration * 100)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;small&gt;${row.label}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }

      function renderStageTable(repo) {
        root.querySelector(&#x27;[data-stage-table]&#x27;).innerHTML = stageOrder.map((id) =&gt; {
          const stage = repo.stages[id];
          const status = stageStatus(stage);
          return `&lt;div class=&quot;sdd-stat-grid sdd-stat-grid-row&quot;&gt;&lt;span class=&quot;sdd-stat-stage&quot;&gt;&lt;i class=&quot;sdd-status-dot&quot; data-tone=&quot;${status.tone}&quot;&gt;&lt;/i&gt;${stageLabels[id]}&lt;/span&gt;&lt;strong&gt;${stage.samples}&lt;/strong&gt;&lt;strong&gt;${stage.tokens === null ? &#x27;—&#x27; : fmtTokens(stage.tokens)}&lt;/strong&gt;&lt;strong&gt;${fmtDuration(stage.durationSec)}&lt;/strong&gt;&lt;strong&gt;${outputText(stage.output)}&lt;/strong&gt;&lt;strong class=&quot;${status.tone === &#x27;ok&#x27; ? &#x27;sdd-success&#x27; : status.tone === &#x27;warn&#x27; ? &#x27;sdd-warning&#x27; : &#x27;sdd-fail&#x27;}&quot;&gt;${stage.success.toFixed(1)}%&lt;/strong&gt;&lt;/div&gt;`;
        }).join(&#x27;&#x27;);
      }

      function renderDetail(id) {
        const repo = repositories.find((item) =&gt; item.id === id);
        if (!repo) { setView(&#x27;overview&#x27;); return; }
        state.repoId = id;
        const tokens = tokenTotal(repo);
        const duration = durationTotal(repo);
        root.querySelector(&#x27;[data-detail-title]&#x27;).textContent = repo.id;
        root.querySelector(&#x27;[data-detail-description]&#x27;).textContent = `${repo.component} 代码仓整体 SDD / Implement 执行成本和阶段分布。`;
        root.querySelector(&#x27;[data-detail-component]&#x27;).textContent = `组件：${repo.component}`;
        root.querySelector(&#x27;[data-detail-branch]&#x27;).textContent = repo.branch;
        root.querySelector(&#x27;[data-detail-sample]&#x27;).textContent = `N = ${repo.tasks}`;
        root.querySelector(&#x27;[data-detail-total-token]&#x27;).textContent = fmtTokens(tokens);
        root.querySelector(&#x27;[data-detail-total-time]&#x27;).textContent = fmtDuration(duration);
        root.querySelector(&#x27;[data-detail-doc-output]&#x27;).textContent = `${fmtNumber(docsTotal(repo))} 行`;
        root.querySelector(&#x27;[data-detail-code-output]&#x27;).textContent = `${fmtNumber(repo.stages.code.output.value)} LOC`;
        root.querySelector(&#x27;[data-detail-dt-pass]&#x27;).textContent = `${repo.stages.dt.success.toFixed(1)}%`;
        root.querySelector(&#x27;[data-token-total-label]&#x27;).textContent = `总计 ${fmtTokens(tokens)}`;
        root.querySelector(&#x27;[data-time-total-label]&#x27;).textContent = `总计 ${fmtDuration(duration)}`;
        root.querySelector(&#x27;[data-output-spec]&#x27;).textContent = outputText(repo.stages.spec.output);
        root.querySelector(&#x27;[data-output-design]&#x27;).textContent = outputText(repo.stages.design.output);
        root.querySelector(&#x27;[data-output-plan]&#x27;).textContent = outputText(repo.stages.plan.output);
        root.querySelector(&#x27;[data-output-code]&#x27;).textContent = outputText(repo.stages.code.output);
        renderFlow(repo);
        renderBars(repo, &#x27;[data-token-bars]&#x27;, &#x27;tokens&#x27;, tokens, false);
        renderBars(repo, &#x27;[data-time-bars]&#x27;, &#x27;durationSec&#x27;, duration, true);
        renderBreakdown(repo, &#x27;tokens&#x27;, &#x27;[data-token-stack]&#x27;, &#x27;[data-token-legend]&#x27;, tokens);
        renderBreakdown(repo, &#x27;durationSec&#x27;, &#x27;[data-time-stack]&#x27;, &#x27;[data-time-legend]&#x27;, duration);
        renderTrend(repo);
        renderStageTable(repo);
        const codeShare = repo.stages.code.tokens / tokens * 100;
        const timeShare = repo.stages.code.durationSec / duration * 100;
        root.querySelector(&#x27;[data-detail-insight]&#x27;).innerHTML = `&lt;strong&gt;管理判断&lt;/strong&gt;&lt;span&gt;代码阶段占平均 Token 的 ${codeShare.toFixed(1)}%，占平均耗时的 ${timeShare.toFixed(1)}%，是当前 ${esc(repo.id)} 的主要资源消耗点。&lt;/span&gt;`;
        setView(&#x27;detail&#x27;);
      }

      function syncHash() {
        const parts = window.location.hash.replace(/^#/, &#x27;&#x27;).split(&#x27;/&#x27;).filter(Boolean);
        if (parts[0] === &#x27;repo&#x27; &amp;&amp; parts[1] &amp;&amp; repositories.some((repo) =&gt; repo.id === decodeURIComponent(parts[1]))) {
          renderDetail(decodeURIComponent(parts[1]));
          return;
        }
        state.repoId = null;
        setView(&#x27;overview&#x27;);
        renderOverview();
      }

      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const repoButton = event.target.closest(&#x27;[data-open-repo]&#x27;);
        if (repoButton) { window.location.hash = `repo/${encodeURIComponent(repoButton.dataset.openRepo)}`; return; }
        const backButton = event.target.closest(&#x27;[data-back-to-overview]&#x27;);
        if (backButton) { window.location.hash = &#x27;&#x27;; return; }
      });
      window.addEventListener(&#x27;hashchange&#x27;, syncHash);
      syncHash();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
