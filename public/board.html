    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;

  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;sdd-repository-stage-board&quot;&gt;
  &lt;style&gt;
    @import url(&#x27;https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500&amp;display=swap&#x27;);

    #sdd-repository-stage-board {
      --srb-canvas: light-dark(#e8eef4, #0d151e);
      --srb-surface: light-dark(#f9fbfd, #14202b);
      --srb-surface-strong: light-dark(#ffffff, #1a2936);
      --srb-ink: light-dark(#102334, #edf5fc);
      --srb-muted: light-dark(#5b6c7b, #9dafc0);
      --srb-line: light-dark(#c2ced9, #334656);
      --srb-line-strong: light-dark(#8596a5, #567083);
      --srb-spec: light-dark(#145fc6, #78a9ff);
      --srb-spec-soft: light-dark(#dceaff, #173861);
      --srb-impl: light-dark(#a25d00, #ffc368);
      --srb-impl-soft: light-dark(#fff0d7, #483315);
      --srb-knowledge: light-dark(#08775a, #69d3b0);
      --srb-knowledge-soft: light-dark(#daf3ea, #163d33);
      --srb-alert: light-dark(#b43b30, #ff8d83);
      --srb-alert-soft: light-dark(#ffe3df, #4a2526);
      --srb-shadow: light-dark(rgba(30, 55, 76, 0.13), rgba(0, 0, 0, 0.3));
      color-scheme: light dark;
      color: var(--srb-ink);
      font-family: &quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, sans-serif;
      width: 100%;
    }

    #sdd-repository-stage-board * {
      box-sizing: border-box;
    }

    #sdd-repository-stage-board button {
      font: inherit;
    }

    #sdd-repository-stage-board h1,
    #sdd-repository-stage-board h2,
    #sdd-repository-stage-board h3,
    #sdd-repository-stage-board p,
    #sdd-repository-stage-board dl,
    #sdd-repository-stage-board dd,
    #sdd-repository-stage-board dt,
    #sdd-repository-stage-board ol,
    #sdd-repository-stage-board ul {
      margin: 0;
    }

    #sdd-repository-stage-board .srb-app {
      background: var(--srb-canvas);
      border: 1px solid var(--srb-line);
      box-shadow: 0 18px 45px var(--srb-shadow);
      min-width: 0;
      overflow: hidden;
    }

    #sdd-repository-stage-board .srb-topbar {
      align-items: center;
      background: var(--srb-surface-strong);
      border-bottom: 1px solid var(--srb-line-strong);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      padding: 22px 26px;

    #sdd-repository-stage-board .srb-brand {
      display: grid;
      gap: 3px;
    }

    #sdd-repository-stage-board .srb-wordmark,
    #sdd-repository-stage-board .srb-eyebrow,
    #sdd-repository-stage-board .srb-meta,
    #sdd-repository-stage-board .srb-stat-label,
    #sdd-repository-stage-board .srb-repo-column-label,
    #sdd-repository-stage-board .srb-stage-number,
    #sdd-repository-stage-board .srb-threshold,
    #sdd-repository-stage-board .srb-footnote {
      font-family: &quot;IBM Plex Mono&quot;, monospace;
      letter-spacing: 0.03em;
    }

    #sdd-repository-stage-board .srb-wordmark {
      color: var(--srb-spec);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #sdd-repository-stage-board .srb-brand strong {

      font-weight: 500;
    }

    #sdd-repository-stage-board .srb-demo {

      border-radius: 999px;
      color: var(--srb-spec);

      font-size: 11px;
      font-weight: 500;
      padding: 6px 10px;
      text-transform: uppercase;
    }

    #sdd-repository-stage-board .srb-screen[hidden] {
      display: none;
    }

    #sdd-repository-stage-board .srb-screen {
      display: grid;
      gap: 24px;
      padding: 26px;
    }

    #sdd-repository-stage-board .srb-page-head {
      align-items: end;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      justify-content: space-between;
    }

    #sdd-repository-stage-board .srb-page-head h1 {

      letter-spacing: -0.04em;

      margin-top: 6px;
    }

    #sdd-repository-stage-board .srb-meta {

    #sdd-repository-stage-board .srb-repo-list {
      display: grid;
      gap: 8px;

    #sdd-repository-stage-board .srb-repo-columns,

      display: grid;

      grid-template-columns: minmax(170px, 1.25fr) minmax(72px, 0.48fr) minmax(120px, 0.82fr) minmax(175px, 1.08fr) 22px;
    }

    #sdd-repository-stage-board .srb-repo-columns {
      align-items: end;
      border-bottom: 1px solid var(--srb-line-strong);
      padding: 0 16px 9px;
    }

    #sdd-repository-stage-board .srb-repo-column-label {
      color: var(--srb-muted);
      font-size: 10px;
      text-transform: uppercase;
    }

    #sdd-repository-stage-board .srb-repo-column-label[data-stage=&quot;spec&quot;] {
      color: var(--srb-spec);
    }

    #sdd-repository-stage-board .srb-repo-column-label[data-stage=&quot;impl&quot;] {
      color: var(--srb-impl);
    }

    #sdd-repository-stage-board .srb-repo-row {
      align-items: center;
      background: var(--srb-surface-strong);
      border: 1px solid var(--srb-line);
      color: var(--srb-ink);
      cursor: pointer;
      padding: 17px 16px;
      text-align: left;
      transition: border-color 140ms ease, transform 140ms ease;
      width: 100%;
    }

    #sdd-repository-stage-board .srb-repo-row:hover {
      border-color: var(--srb-spec);
      transform: translateY(-1px);
    }

    #sdd-repository-stage-board .srb-repo-row:focus-visible,
    #sdd-repository-stage-board .srb-back:focus-visible,
    #sdd-repository-stage-board .srb-spec-item:focus-visible {
      outline: 2px solid var(--srb-spec);
      outline-offset: 3px;
    }

    #sdd-repository-stage-board .srb-repo-name {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    #sdd-repository-stage-board .srb-repo-name strong {
      font-family: &quot;IBM Plex Mono&quot;, monospace;
      font-size: 16px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    #sdd-repository-stage-board .srb-repo-name small,
    #sdd-repository-stage-board .srb-repo-cell small,
    #sdd-repository-stage-board .srb-spec-item small,
    #sdd-repository-stage-board .srb-path-caption,
    #sdd-repository-stage-board .srb-empty-knowledge {

    #sdd-repository-stage-board .srb-repo-cell {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    #sdd-repository-stage-board .srb-repo-cell strong {

      font-size: 16px;
      font-weight: 500;
    }

    #sdd-repository-stage-board .srb-repo-cell[data-stage=&quot;spec&quot;] strong {
      color: var(--srb-spec);
    }

    #sdd-repository-stage-board .srb-repo-cell[data-stage=&quot;impl&quot;] strong {
      color: var(--srb-impl);
    }

    #sdd-repository-stage-board .srb-repo-cell .srb-mini-knowledge {

    }

    #sdd-repository-stage-board .srb-chevron {

    #sdd-repository-stage-board .srb-repo-title {

    #sdd-repository-stage-board .srb-stage-summary-block {

    #sdd-repository-stage-board .srb-stage-summary-block[data-stage=&quot;spec&quot;] {

    #sdd-repository-stage-board .srb-stage-summary-block[data-stage=&quot;impl&quot;] {

    #sdd-repository-stage-board .srb-stage-summary-block[data-stage=&quot;spec&quot;] .srb-stage-stat strong {

    #sdd-repository-stage-board .srb-status[data-tone=&quot;ok&quot;] {

    #sdd-repository-stage-board .srb-spec-detail {

      gap: 14px;
      min-width: 0;

    #sdd-repository-stage-board .srb-spec-head {

      grid-template-columns: 1fr 1fr;

    #sdd-repository-stage-board .srb-phase {

      min-width: 0;

    #sdd-repository-stage-board .srb-phase[data-stage=&quot;spec&quot;] {

    #sdd-repository-stage-board .srb-phase[data-stage=&quot;impl&quot;] {

    #sdd-repository-stage-board .srb-phase-metrics {

      grid-template-columns: repeat(3, minmax(0, 1fr));

    #sdd-repository-stage-board .srb-phase-metric {

      gap: 5px;
      min-width: 0;

      font-size: 17px;
